[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-docs-cli"
version = "0.1.0"
description = "agent-docs CLI: publish, view, and version history over HTTP."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
agentdocs = "agent_docs_cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
